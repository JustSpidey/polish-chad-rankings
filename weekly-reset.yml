name: Weekly ranking reset

on:
  schedule:
    # GitHub używa UTC. Kilka terminów pokrywa czas letni/zimowy i opóźnienia;
    # skrypt sam pilnuje, żeby zadziałać raz, w poniedziałek rano czasu warszawskiego.
    - cron: '5 22,23 * * 0'
    - cron: '5 0,1,2,3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tylko pokaż wynik, nic nie zapisuj'
        type: boolean
        default: true
      force:
        description: 'Pomiń sprawdzanie godziny i ostatniego resetu'
        type: boolean
        default: false

concurrency:
  group: weekly-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install firebase-admin
        run: npm install --no-save --no-audit --no-fund --prefix scripts firebase-admin@12
      - name: Run reset
        run: node scripts/weekly-reset.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: https://polish-chad-rankings-default-rtdb.europe-west1.firebasedatabase.app
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
