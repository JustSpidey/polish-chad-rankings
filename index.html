<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polish Chad Rankings</title>
  <style>
    :root {
      --bg: radial-gradient(circle at top, #2e1050 0%, #0d0e12 100%);
      --card-bg: rgba(22, 24, 30, 0.85);
      --accent: #d4af37; /* Złoty akcent */
      --text: #ffffff;
      --subtext: #babbbe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 2px solid #22252e;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--text);
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: rgba(46, 50, 61, 0.6);
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .tab {
      color: var(--subtext);
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab.active {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }

    .tab-icon {
      font-size: 1.2rem;
    }

    .rankings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      position: relative;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--accent);
      width: 24px;
    }

    .avatar-locked {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .info h3 {
      font-size: 1rem;
      margin-bottom: 2px;
      color: #dfdfdf;
    }

    .info p {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: lowercase;
    }

    .score-locked {
      font-weight: bold;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .lock-icon {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo-container">
        <h1>Polish Chad rankings</h1>
      </div>
      <div class="tabs">
        <a href="#" class="tab"><span class="tab-icon">📋</span> Rankings</a>
      </div>
    </header>

    <main class="rankings-list" id="rankings"></main>
  </div>

  <script>
    // Generowanie listy Top 10 w trybie "Do ujawnienia"
    const rankingsContainer = document.getElementById("rankings");

    for (let i = 1; i <= 10; i++) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-left">
          <span class="rank">#${i}</span>
          <div class="avatar-locked">?</div>
          <div class="info">
            <h3>DO UJAWNIENIA</h3>
            <p>tajemniczy chad</p>
          </div>
        </div>
        <div class="score-locked">99.9</div>
        <span class="lock-icon">🔒</span>
      `;
      rankingsContainer.appendChild(card);
    }
  </script>
</body>
</html>
