name: Powiadomienia push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: push-worker
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalacja
        run: npm install --prefix push-worker --no-audit --no-fund
      - name: Wyślij powiadomienia
        run: node push-worker/push-worker.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATABASE_URL: https://polish-chad-rankings-default-rtdb.europe-west1.firebasedatabase.app
